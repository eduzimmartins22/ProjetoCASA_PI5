<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controlador LED & Jato d'Água</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(10px);
        }

        h1 {
            text-align: center;
            color: #4a5568;
            margin-bottom: 30px;
            font-size: 2rem;
            font-weight: 600;
        }

        .section {
            margin-bottom: 30px;
            padding: 20px;
            border-radius: 15px;
            background: linear-gradient(145deg, #f7fafc, #edf2f7);
            box-shadow: inset 2px 2px 5px #d1d9e6, inset -2px -2px 5px #ffffff;
        }

        .section h2 {
            color: #2d3748;
            margin-bottom: 20px;
            font-size: 1.3rem;
            text-align: center;
        }

        .controls {
            display: grid;
            gap: 15px;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
        }

        .btn {
            background: linear-gradient(145deg, #4299e1, #3182ce);
            color: white;
            border: none;
            padding: 15px 20px;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(66, 153, 225, 0.3);
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(66, 153, 225, 0.4);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn.led-btn {
            background: linear-gradient(145deg, #48bb78, #38a169);
            box-shadow: 0 4px 15px rgba(72, 187, 120, 0.3);
        }

        .btn.led-btn:hover {
            box-shadow: 0 6px 20px rgba(72, 187, 120, 0.4);
        }

        .btn.water-btn {
            background: linear-gradient(145deg, #4299e1, #2b6cb0);
            box-shadow: 0 4px 15px rgba(66, 153, 225, 0.3);
        }

        .btn.water-btn:hover {
            box-shadow: 0 6px 20px rgba(66, 153, 225, 0.4);
        }

        .btn.danger {
            background: linear-gradient(145deg, #f56565, #e53e3e);
            box-shadow: 0 4px 15px rgba(245, 101, 101, 0.3);
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 15px;
        }

        label {
            font-weight: 600;
            color: #4a5568;
        }

        input, select {
            padding: 12px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.3s ease;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #4299e1;
            box-shadow: 0 0 0 3px rgba(66, 153, 225, 0.1);
        }

        .color-picker {
            height: 50px;
            border-radius: 8px;
            cursor: pointer;
        }

        .status {
            text-align: center;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-weight: 600;
        }

        .status.success {
            background: rgba(72, 187, 120, 0.1);
            color: #38a169;
            border: 2px solid rgba(72, 187, 120, 0.3);
        }

        .water-level {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-top: 15px;
        }

        .level-bar {
            flex: 1;
            height: 20px;
            background: #e2e8f0;
            border-radius: 10px;
            overflow: hidden;
        }

        .level-fill {
            height: 100%;
            background: linear-gradient(90deg, #4299e1, #2b6cb0);
            width: 50%;
            transition: width 0.3s ease;
        }

        @media (max-width: 640px) {
            .container {
                margin: 10px;
                padding: 20px;
            }

            h1 {
                font-size: 1.5rem;
            }

            .controls {
                grid-template-columns: 1fr;
            }

            .btn {
                padding: 18px 20px;
                font-size: 1.1rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎮 Controlador Home 🎮</h1>

        <!-- Status -->
        <div class="status success" id="status">
            Sistema conectado e pronto!
        </div>

        <!-- Controles LED -->
        <div class="section">
            <h2>💡 Controle de LEDs</h2>
            <div class="controls">
                <button class="btn led-btn" onclick="toggleLED()">
                    <span id="led-status">LIGAR LED</span>
                </button>
                
                <div class="input-group">
                    <label for="led-color">Escolher Cor:</label>
                    <input type="color" id="led-color" class="color-picker" value="#ff0000" onchange="updateLEDColor()">
                </div>

                <div class="input-group">
                    <label for="led-position">Posição do LED (0-9):</label>
                    <select id="led-position" onchange="selectLEDPosition()">
                        <option value="0">LED 1</option>
                        <option value="1">LED 2</option>
                        <option value="2">LED 3</option>
                        <option value="3">LED 4</option>
                        <option value="4">LED 5</option>
                        <option value="5">LED 6</option>
                        <option value="6">LED 7</option>
                        <option value="7">LED 8</option>
                        <option value="8">LED 9</option>
                        <option value="9">LED 10</option>
                    </select>
                </div>

                <button class="btn led-btn" onclick="applyColorToPosition()">
                    APLICAR COR NA POSIÇÃO
                </button>
            </div>
        </div>

        <!-- Controles Jato d'Água -->
        <div class="section">
            <h2>💧 Controle do Jato d'Água</h2>
            <div class="controls">
                <button class="btn water-btn" onclick="toggleWater()">
                    <span id="water-status">LIGAR JATO D'ÁGUA</span>
                </button>
                
                <button class="btn water-btn" onclick="increaseWater()">
                    ⬆️ AUMENTAR JATO
                </button>
                
                <button class="btn danger" onclick="decreaseWater()">
                    ⬇️ DIMINUIR JATO
                </button>
            </div>
            
            <div class="water-level">
                <span>Intensidade:</span>
                <div class="level-bar">
                    <div class="level-fill" id="water-level"></div>
                </div>
                <span id="water-percentage">50%</span>
            </div>
        </div>
    </div>

    <script>
        // Estado do sistema
        let ledState = false;
        let waterState = false;
        let waterLevel = 50;
        let currentColor = "#ff0000";
        let currentPosition = 0;
        let ledPositions = new Array(10).fill("#000000");

        // Funções LED
        function toggleLED() {
            ledState = !ledState;
            const btn = document.getElementById('led-status');
            btn.textContent = ledState ? 'DESLIGAR LED' : 'LIGAR LED';
            
            // Enviar comando para C++
            sendCommand('LED_TOGGLE', { state: ledState });
            updateStatus(`LEDs ${ledState ? 'ligados' : 'desligados'}`);
        }

        function updateLEDColor() {
            currentColor = document.getElementById('led-color').value;
            sendCommand('LED_COLOR', { color: currentColor });
            updateStatus(`Cor selecionada: ${currentColor}`);
        }

        function selectLEDPosition() {
            currentPosition = parseInt(document.getElementById('led-position').value);
            updateStatus(`Posição selecionada: LED ${currentPosition + 1}`);
        }

        function applyColorToPosition() {
            ledPositions[currentPosition] = currentColor;
            sendCommand('LED_SET_POSITION', { 
                position: currentPosition, 
                color: currentColor 
            });
            updateStatus(`Cor ${currentColor} aplicada no LED ${currentPosition + 1}`);
        }

        // Funções Jato d'Água
        function toggleWater() {
            waterState = !waterState;
            const btn = document.getElementById('water-status');
            btn.textContent = waterState ? 'DESLIGAR JATO D\'ÁGUA' : 'LIGAR JATO D\'ÁGUA';
            
            sendCommand('WATER_TOGGLE', { state: waterState });
            updateStatus(`Jato d'água ${waterState ? 'ligado' : 'desligado'}`);
        }

        function increaseWater() {
            if (waterLevel < 100) {
                waterLevel = Math.min(100, waterLevel + 10);
                updateWaterLevel();
                sendCommand('WATER_INCREASE', { level: waterLevel });
                updateStatus(`Jato aumentado para ${waterLevel}%`);
            }
        }

        function decreaseWater() {
            if (waterLevel > 0) {
                waterLevel = Math.max(0, waterLevel - 10);
                updateWaterLevel();
                sendCommand('WATER_DECREASE', { level: waterLevel });
                updateStatus(`Jato diminuído para ${waterLevel}%`);
            }
        }

        function updateWaterLevel() {
            document.getElementById('water-level').style.width = waterLevel + '%';
            document.getElementById('water-percentage').textContent = waterLevel + '%';
        }

        function updateStatus(message) {
            document.getElementById('status').textContent = message;
            setTimeout(() => {
                document.getElementById('status').textContent = 'Sistema conectado e pronto!';
            }, 3000);
        }

        // Simulação de comunicação com C++
        function sendCommand(command, data) {
            console.log('Comando enviado:', command, data);
            
            // Aqui você integraria com sua comunicação serial/WebSocket/HTTP
            // Exemplo de estrutura do comando:
            const commandData = {
                timestamp: new Date().toISOString(),
                command: command,
                payload: data
            };
            
            // Para integração real, você pode usar:
            // - WebSocket para comunicação em tempo real
            // - Fetch API para HTTP requests
            // - Serial API (em navegadores compatíveis)
            
            console.log('JSON para C++:', JSON.stringify(commandData));
        }

        // Inicialização
        document.addEventListener('DOMContentLoaded', function() {
            updateWaterLevel();
            updateStatus('Sistema carregado. Conecte ao Arduino para começar.');
            
            // Auto-conectar se já houver uma conexão serial salva
            if ('serial' in navigator) {
                navigator.serial.getPorts().then(ports => {
                    if (ports.length > 0) {
                        updateStatus('Porta serial detectada. Clique em CONECTAR.');
                    }
                });
            }
        });

        // Simular recebimento de dados do C++
        function simulateDataFromArduino() {
            // Aqui você receberia dados do seu sistema C++
            // Exemplo: status dos sensores, confirmações de comando, etc.
        }
    </script>
</body>
</html>
